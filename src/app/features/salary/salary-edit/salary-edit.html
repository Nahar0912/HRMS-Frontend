<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg border border-gray-200">
  
  <!-- Header showing employeeId -->
  <h2 class="text-2xl font-semibold mb-6 text-gray-800">
    Edit Salary: 
    <span *ngIf="employeeId !== null; else loading">{{ employeeId }}</span>
  </h2>

  <ng-template #loading>
    <span class="text-gray-400">Loading employee info...</span>
  </ng-template>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

    <!-- Basic Salary -->
    <div>
      <label class="block text-gray-700 mb-1">Basic Salary</label>
      <input type="number" formControlName="basicSalary"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter basic salary">
      <p *ngIf="hasError('basicSalary')" class="text-red-500 text-sm mt-1">
        Basic Salary is required and must be ≥ 0
      </p>
    </div>

    <!-- Bonus -->
    <div>
      <label class="block text-gray-700 mb-1">Bonus</label>
      <input type="number" formControlName="bonus"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter bonus">
      <p *ngIf="hasError('bonus')" class="text-red-500 text-sm mt-1">
        Bonus must be ≥ 0
      </p>
    </div>

    <!-- Deduction -->
    <div>
      <label class="block text-gray-700 mb-1">Deduction</label>
      <input type="number" formControlName="deduction"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter deduction">
      <p *ngIf="hasError('deduction')" class="text-red-500 text-sm mt-1">
        Deduction must be ≥ 0
      </p>
    </div>

    <!-- Effective From -->
    <div>
      <label class="block text-gray-700 mb-1">Effective From</label>
      <input type="date" formControlName="effectiveFrom"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">
      <p *ngIf="hasError('effectiveFrom')" class="text-red-500 text-sm mt-1">
        Date is required
      </p>
    </div>

    <!-- Submit Button -->
    <div class="pt-4">
      <button type="submit"
              class="w-full bg-green-600 text-white py-2 px-4 rounded-md font-medium hover:bg-green-700 transition">
        Update Salary
      </button>
    </div>

  </form>
</div>
