<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg border border-gray-200">

  <h2 class="text-2xl font-semibold mb-6 text-gray-800">Add Salary</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

    <!-- Employee ID -->
    <div>
      <label class="block text-gray-700 mb-1">Employee ID</label>
      <input type="number"
             formControlName="employeeId"
             class="w-full px-4 py-2 border rounded-md"
             placeholder="Enter Employee ID" />
      <p *ngIf="hasError('employeeId')" class="text-red-500 text-sm mt-1">Employee ID is required</p>
    </div>

    <!-- Basic Salary -->
    <div>
      <label class="block text-gray-700 mb-1">Basic Salary</label>
      <input type="number" formControlName="basicSalary"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter basic salary" />
      <p *ngIf="hasError('basicSalary')" class="text-red-500 text-sm mt-1">Basic salary is required and must be ≥ 0</p>
    </div>

    <!-- Bonus -->
    <div>
      <label class="block text-gray-700 mb-1">Bonus</label>
      <input type="number" formControlName="bonus"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter bonus" />
      <p *ngIf="hasError('bonus')" class="text-red-500 text-sm mt-1">Bonus must be ≥ 0</p>
    </div>

    <!-- Deduction -->
    <div>
      <label class="block text-gray-700 mb-1">Deduction</label>
      <input type="number" formControlName="deduction"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter deduction" />
      <p *ngIf="hasError('deduction')" class="text-red-500 text-sm mt-1">Deduction must be ≥ 0</p>
    </div>

    <!-- Effective From -->
    <div>
      <label class="block text-gray-700 mb-1">Effective From</label>
      <input type="date" formControlName="effectiveFrom"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <p *ngIf="hasError('effectiveFrom')" class="text-red-500 text-sm mt-1">Effective date is required</p>
    </div>

    <!-- Submit Button -->
    <div class="pt-4">
      <button type="submit"
              class="w-full bg-blue-600 text-white py-2 px-4 rounded-md font-medium hover:bg-blue-700 transition">
        Save Salary
      </button>
    </div>

  </form>
</div>
