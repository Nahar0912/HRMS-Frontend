<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg border border-gray-200">

  <!-- Popup Message -->
  <div *ngIf="showMessage"
       [ngClass]="{
         'bg-green-100 border-green-400 text-green-700': messageType === 'success',
         'bg-red-100 border-red-400 text-red-700': messageType === 'error',
         'bg-blue-100 border-blue-400 text-blue-700': messageType === 'info'
       }"
       class="border px-4 py-3 rounded mb-4">
    {{ message }}
  </div>

  <h2 class="text-2xl font-semibold mb-6 text-gray-800">
    {{ id ? 'Edit Employee' : 'Add Employee' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

    <!-- Name -->
    <div>
      <label class="block text-gray-700 mb-1">Name</label>
      <input formControlName="name"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter name">
      <p *ngIf="hasError('name')" class="text-red-500 text-sm mt-1">Name is required</p>
    </div>

    <!-- Email -->
    <div>
      <label class="block text-gray-700 mb-1">Email</label>
      <input formControlName="email" type="email"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter email">
      <p *ngIf="hasError('email')" class="text-red-500 text-sm mt-1">Valid email is required</p>
    </div>

    <!-- Contact -->
    <div>
      <label class="block text-gray-700 mb-1">Contact</label>
      <input formControlName="contact"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter contact">
      <p *ngIf="hasError('contact')" class="text-red-500 text-sm mt-1">Contact is required</p>
    </div>

    <!-- Position -->
    <div>
      <label class="block text-gray-700 mb-1">Position</label>
      <input formControlName="position"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter position">
      <p *ngIf="hasError('position')" class="text-red-500 text-sm mt-1">Position is required</p>
    </div>

    <!-- Department -->
    <div>
      <label class="block text-gray-700 mb-1">Department</label>
      <input formControlName="department"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter department">
      <p *ngIf="hasError('department')" class="text-red-500 text-sm mt-1">Department is required</p>
    </div>

    <!-- Account Number -->
    <div>
      <label class="block text-gray-700 mb-1">Account Number</label>
      <input formControlName="accountNumber"
             class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400"
             placeholder="Enter account number">
      <p *ngIf="hasError('accountNumber')" class="text-red-500 text-sm mt-1">Account number is required</p>
    </div>

    <!-- Employment Status -->
    <div>
      <label class="block text-gray-700 mb-1">Employment Status</label>
      <select formControlName="employmentStatus"
              class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>

    <!-- Submit Button -->
    <div class="pt-4">
      <button type="submit"
              class="w-full bg-blue-600 text-white py-2 px-4 rounded-md font-medium hover:bg-blue-700 transition">
        {{ id ? 'Update Employee' : 'Save Employee' }}
      </button>
    </div>

  </form>
</div>
