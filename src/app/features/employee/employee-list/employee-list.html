<div class="p-6 max-w-7xl mx-auto bg-white shadow-lg rounded-lg">
  <!-- Header -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
    <h2 class="text-2xl font-bold text-gray-800">Employees</h2>
    <a routerLink="/employee/add"
       class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded shadow transition">
      Add Employee
    </a>
  </div>

  <!-- Search -->
  <div class="mb-4">
    <input placeholder="Search..." 
           class="w-full md:w-1/3 px-4 py-2 border rounded shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
           (input)="applyFilter($event)">
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table mat-table [dataSource]="dataSource" matSort class="min-w-full divide-y divide-gray-200">
      
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-4 py-2 text-left text-gray-700 font-semibold">ID</th>
        <td mat-cell *matCellDef="let e" class="px-4 py-2">{{ e.id }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-4 py-2 text-left text-gray-700 font-semibold">Name</th>
        <td mat-cell *matCellDef="let e" class="px-4 py-2">{{ e.name }}</td>
      </ng-container>

      <!-- Email Column -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header class="px-4 py-2 text-left text-gray-700 font-semibold">Email</th>
        <td mat-cell *matCellDef="let e" class="px-4 py-2">{{ e.email }}</td>
      </ng-container>

      <!-- Contact Column -->
      <ng-container matColumnDef="contact">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left text-gray-700 font-semibold">Contact</th>
        <td mat-cell *matCellDef="let e" class="px-4 py-2">{{ e.contact }}</td>
      </ng-container>

      <!-- Position Column -->
      <ng-container matColumnDef="position">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left text-gray-700 font-semibold">Position</th>
        <td mat-cell *matCellDef="let e" class="px-4 py-2">{{ e.position }}</td>
      </ng-container>

      <!-- Department Column -->
      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left text-gray-700 font-semibold">Department</th>
        <td mat-cell *matCellDef="let e" class="px-4 py-2">{{ e.department }}</td>
      </ng-container>

      <!-- Account Number Column -->
      <ng-container matColumnDef="accountNumber">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left text-gray-700 font-semibold">Account No</th>
        <td mat-cell *matCellDef="let e" class="px-4 py-2">{{ e.accountNumber }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="employmentStatus">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left text-gray-700 font-semibold">Status</th>
        <td mat-cell *matCellDef="let e" class="px-4 py-2">
          <span [ngClass]="{
            'bg-green-100 text-green-800 px-2 py-1 rounded-full text-xs font-semibold': e.employmentStatus === 'Active',
            'bg-red-100 text-red-800 px-2 py-1 rounded-full text-xs font-semibold': e.employmentStatus === 'Inactive'
          }">{{ e.employmentStatus }}</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="px-4 py-2 text-left text-gray-700 font-semibold">Actions</th>
        <td mat-cell *matCellDef="let e" class="px-4 py-2 space-x-2">
          <!-- Edit Button -->
          <button [routerLink]="['/employee/edit', e.id]" 
                  class="bg-yellow-400 hover:bg-yellow-500 text-white px-3 py-1 rounded shadow transition font-medium">
            Edit
          </button>

          <!-- Delete Button -->
          <button (click)="delete(e.id!)" 
                  class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded shadow transition font-medium">
            Delete
          </button>
        </td>
      </ng-container>

      <!-- Header & Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-100"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition"></tr>
    </table>
  </div>

  <!-- Paginator -->
  <div class="mt-4">
    <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons></mat-paginator>
  </div>
</div>
