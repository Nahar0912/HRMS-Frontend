<div class="h-full flex items-center justify-center bg-gradient-to-br from-slate-100 via-blue-200 to-indigo-400 px-4">

  <div class="w-full max-w-md bg-white/90 backdrop-blur-md p-8 rounded-2xl shadow-xl border border-gray-100">

    <h2 class="text-3xl font-bold text-center text-gray-800 mb-2">Welcome Back</h2>
    <p class="text-center text-gray-500 mb-6 text-sm">Please login to continue</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <!-- Email -->
      <div>
        <input type="email" formControlName="email" placeholder="Email address" autocomplete="email" 
        class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition"
        />
        <p *ngIf="hasError('email')" class="text-red-500 text-xs mt-1">Please enter a valid email</p>
      </div>

      <!-- Password -->
      <div class="relative">
        <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password" autocomplete="current-password" 
        class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-50 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition"
        />
        <button
          type="button" (click)="showPassword = !showPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-gray-500 hover:text-gray-700"
        > 
        {{ showPassword ? 'Hide' : 'Show' }}
        </button>

        <p *ngIf="hasError('password')" class="text-red-500 text-xs mt-1">Password is required</p>

      </div>

      <!-- Button -->
      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-3 rounded-xl hover:from-blue-700 hover:to-blue-800 shadow-md transition font-medium disabled:opacity-50 disabled:cursor-not-allowed"
      >
      {{ loading() ? 'Logging in...' : 'Login' }}
      </button>

    </form>

    <!-- Register link -->
    <p class="text-center mt-6 text-sm text-gray-500">
      Don't have an account?
      <a routerLink="/register" class="text-blue-600 font-medium hover:underline">
        Create account
      </a>
    </p>

  </div>

</div>
