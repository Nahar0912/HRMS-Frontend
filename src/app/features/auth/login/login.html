<div class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

    <!-- Email -->
    <div>
      <input type="email" formControlName="email"
             placeholder="Email"
             class="w-full border px-4 py-2 rounded">
      <p *ngIf="hasError('email')" class="text-red-500 text-sm mt-1">
        Please enter a valid email
      </p>
    </div>

    <!-- Password -->
    <div>
      <input type="password" formControlName="password"
             placeholder="Password"
             class="w-full border px-4 py-2 rounded">
      <p *ngIf="hasError('password')" class="text-red-500 text-sm mt-1">
        Password is required
      </p>
    </div>

    <!-- Backend Error Message -->
    <div *ngIf="errorMessage" class="text-red-500 text-sm">
      {{ errorMessage }}
    </div>

    <!-- Login Button -->
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
      Login
    </button>

  </form>

  <!-- Link to Register -->
  <p class="text-center mt-4 text-sm text-gray-600">
    Don't have an account? 
    <a routerLink="/register" class="text-green-600 hover:underline">Register here</a>
  </p>
</div>
