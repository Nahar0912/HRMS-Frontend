<div class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-6 text-center">Register</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">

    <!-- Username -->
    <div>
      <input formControlName="username" placeholder="Username" class="w-full border px-4 py-2 rounded">
      <p *ngIf="hasError('username')" class="text-red-500 text-sm mt-1">Username is required</p>
    </div>

    <!-- Email -->
    <div>
      <input type="email" formControlName="email" placeholder="Email" class="w-full border px-4 py-2 rounded">
      <p *ngIf="hasError('email')" class="text-red-500 text-sm mt-1">Valid email is required</p>
    </div>

    <!-- Password -->
    <div>
      <input type="password" formControlName="password" placeholder="Password" class="w-full border px-4 py-2 rounded">
      <p *ngIf="hasError('password')" class="text-red-500 text-sm mt-1">Password is required (min 6 characters)</p>
    </div>

    <!-- Phone -->
    <div>
      <input formControlName="phone" placeholder="Phone" class="w-full border px-4 py-2 rounded">
      <p *ngIf="hasError('phone')" class="text-red-500 text-sm mt-1">Enter a valid phone number</p>
    </div>

    <!-- Address -->
    <div>
      <input formControlName="address" placeholder="Address" class="w-full border px-4 py-2 rounded">
      <p *ngIf="hasError('address')" class="text-red-500 text-sm mt-1">Address cannot exceed 200 characters</p>
    </div>

    <!-- Register Button -->
    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">
      Register
    </button>

  </form>

  <!-- Link to Login -->
  <p class="text-center mt-4 text-sm text-gray-600">
    Already have an account? 
    <a routerLink="/login" class="text-blue-600 hover:underline">Login here</a>
  </p>
</div>
